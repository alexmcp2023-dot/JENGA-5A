const KEY='jenga-unificado-final-v3';

function challenge(id){if(state.failed)return;const b=blocks[id];const opts=b.options.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);open(`<span class="badge">${b.title}</span><h2>Bloque ${id+1}</h2><p style="color:var(--text);font-size:19px">${b.question}</p>${opts.map((o,k)=>`<button class="choice" data-answer="${o.i}"><b>${String.fromCharCode(65+k)}.</b> ${o.t}</button>`).join('')}<p id="err" class="danger"></p>`);document.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>answer(id,Number(x.dataset.answer)));}

  const towerEl=document.querySelector('.tower');
  if(!el){after();return;}
  const ghost=el.cloneNode(true);
  const r=el.getBoundingClientRect();
  ghost.removeAttribute('data-id');
  ghost.disabled=true;
  ghost.classList.add('lifting');
  ghost.style.position='fixed';
  ghost.style.left=r.left+'px';
  ghost.style.top=r.top+'px';
  ghost.style.width=r.width+'px';
  ghost.style.height=r.height+'px';
  ghost.style.margin='0';
  document.body.appendChild(ghost);
  el.style.visibility='hidden';
  if(towerEl) towerEl.classList.add('shake');
  setTimeout(()=>{ghost.remove();after();},1050);
}
function animateFall(id,after){dlg.close();const el=document.querySelector('[data-id=\"'+id+'\"]');const towerEl=document.querySelector('.tower');if(el){el.classList.add('falling')}if(towerEl){towerEl.classList.add('shake');setTimeout(()=>towerEl.classList.add('dangerTilt'),500)}setTimeout(after,1200)}
function answer(id,a){if(state.failed)return;const b=blocks[id];if(a===b.correct){state.xp+=10;state.stability=Math.min(100,state.stability+4);save();open(`<div class="card good"><h2>¡Correcto!</h2><p>${b.explanation}</p><span class="badge">+10 XP</span></div><button class="primary" style="width:100%" id="cont">Colocar bloque arriba ↗</button>`);$('cont').onclick=()=>animateLift(id,()=>{if(!state.done.includes(id))state.done.push(id);save();game()})}else{state.stability=0;state.failed={id,title:b.title};save();animateFall(id,()=>open(`<div class="card bad"><h2>¡El bloque cayó!</h2><p>${b.explanation}</p><p>La respuesta adecuada era: <strong>${b.options[b.correct]}</strong>.</p><p class="danger"><strong>Fin de la partida.</strong> Al fallar, debes empezar nuevamente desde 0 XP y 0 bloques.</p></div><button class="primary" style="width:100%" id="restartNow">Empezar de nuevo ↗</button>`));setTimeout(()=>{const r=$('restartNow');if(r)r.onclick=restartAfterFail},1250)}}function restartAfterFail(){const name=state.name||'Estudiante';state={name,xp:0,stability:80,done:[],failed:null};save();if(dlg.open)dlg.close();game()}
function finalChallenge(){open(`<h2>Reto final</h2><p>Explica con tus palabras cómo los sacramentos pueden ayudarte a vivir la fe de manera concreta en tu familia, colegio y comunidad.</p><textarea id="reflection" style="width:100%;min-height:130px;background:#10212a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px"></textarea><button class="primary" style="width:100%;margin-top:12px" id="finish">Finalizar</button><p id="msg" class="danger"></p>`);$('finish').onclick=()=>{const t=$('reflection').value.trim();if(t.length<30){$('msg').textContent='Escribe al menos 30 caracteres.';return}state.xp+=100;save();open(`<h2>¡Recorrido completado!</h2><div class="card"><div class="big">${state.xp} XP</div><p>${state.name}, has completado el reto final. Tu reflexión muestra que aprender los sacramentos también significa relacionarlos con la vida cotidiana.</p></div><button class="primary" style="width:100%" id="back">Volver al juego</button>`);$('back').onclick=()=>{dlg.close();game()}}}
function edit(){open(`<h2>Editar los 36 bloques</h2><p>Selecciona un bloque. <strong>Los cambios se guardan automáticamente en este navegador</strong> y seguirán disponibles cuando cierres y vuelvas a abrir el archivo en esta misma computadora.</p><div class="editor">${blocks.map(b=>`<button data-edit="${b.id}"><strong>${b.id+1}</strong><br>${b.title}</button>`).join('')}</div>`);document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editOne(Number(x.dataset.edit)));}
function editOne(id){const b=blocks[id];open(`<h2>Editar bloque ${id+1}</h2><label>Título</label><input id="et" value="${b.title.replace(/"/g,'&quot;')}" style="width:100%"><label>Pregunta</label><textarea id="eq" style="width:100%;min-height:100px">${b.question}</textarea><label>Opción correcta</label><input id="eo" value="${b.options[b.correct].replace(/"/g,'&quot;')}" style="width:100%"><button class="primary" style="width:100%;margin-top:12px" id="saveEdit">Guardar</button>`);$('saveEdit').onclick=()=>{b.title=$('et').value.trim()||b.title;b.question=$('eq').value.trim()||b.question;b.options[b.correct]=$('eo').value.trim()||b.options[b.correct];saveEdits();edit();}}

function exportJSON(){
  const payload={
    app:"JENGA · Los Sacramentos",
    version:2,
    exportedAt:new Date().toISOString(),
    blocks:blocks,
    state:state
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const safe=(state.name||'copia').replace(/[^\w\-áéíóúñÁÉÍÓÚÑ]+/gi,'_');
  a.href=url;
  a.download='JENGA_'+safe+'_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  open(`<h2>Copia exportada</h2><p>Se descargó un archivo <strong>.JSON</strong>. Puedes guardarlo en un USB y llevarlo a otra computadora.</p><p>En la otra computadora abre este juego y pulsa <strong>Importar .JSON</strong> para recuperar tus preguntas, modificaciones y avance.</p>`);
}
function importJSON(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json,application/json';
  input.onchange=()=>{
    const file=input.files&&input.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data || !Array.isArray(data.blocks) || data.blocks.length!==36) throw new Error('Formato no válido');
        const valid=data.blocks.every((b,i)=>b && typeof b.question==='string' && Array.isArray(b.options) && b.options.length>=2);
        if(!valid) throw new Error('Bloques no válidos');
        blocks=data.blocks.map((b,i)=>({
          id:i,
          title:String(b.title||('Bloque '+(i+1))),
          question:String(b.question||''),
          options:b.options.map(String),
          correct:Number.isInteger(b.correct)&&b.correct>=0&&b.correct<b.options.length?b.correct:0,
          explanation:String(b.explanation||'')
        }));
        if(data.state && Array.isArray(data.state.done)){
          state=data.state;
          if(!('failed' in state))state.failed=null;
        }
        save();
        saveEdits();
        open(`<h2>¡Copia importada!</h2><p>Se recuperaron correctamente las modificaciones de los 36 bloques${data.state?' y el avance de la partida':''}.</p><button class="primary" style="width:100%" id="importOK">Continuar</button>`);
        $('importOK').onclick=()=>{dlg.close();home()};
      }catch(err){
        open(`<h2>No se pudo importar</h2><p class="danger">El archivo seleccionado no corresponde a una copia válida de este juego.</p>`);
      }
    };
    reader.readAsText(file,'utf-8');
  };
  input.click();
}

function help(){open(`<h2>Cómo jugar</h2><ol><li>Abre este archivo en Google Chrome.</li><li>Pulsa <strong>Iniciar juego</strong>.</li><li>Elige un bloque de la torre y responde.</li><li>Si respondes correctamente, pulsa <strong>Colocar bloque arriba</strong>: el bloque subirá y aparecerá en la parte superior de la torre.</li><li>Si respondes incorrectamente, el bloque cae y la partida termina. Debes empezar nuevamente desde 0 XP y 0 bloques.</li><li>Al completar 24 bloques se habilita el reto final.</li></ol><p><strong>Importante:</strong> ya no necesitas <code>app.js</code>, <code>styles.css</code> ni la carpeta <code>data</code>. Todo está dentro de este archivo.</p>`)}
$('closeBtn').onclick=()=>dlg.close();$('homeBtn').onclick=home;$('helpBtn').onclick=help;$('editBtn').onclick=edit;$('exportBtn').onclick=exportJSON;$('importBtn').onclick=importJSON;$('resetBtn').onclick=()=>{if(confirm('¿Deseas reiniciar la partida?')){state={name:'',xp:0,stability:80,done:[],failed:null};save();home()}};home();
})();
</script>
</body></html>
